<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
          --bg:       #f7f6f3;
          --card:     #ffffff;
          --border:   #e4e2dc;
          --border-2: #d5d2cb;
          --text:     #1a1916;
          --sub:      #6b6860;
          --muted:    #a8a49e;
          --accent:   #1a1916;
          --green:    #2d6a4f;
          --red:      #c0392b;
          --red-bg:   #fdf2f1;
          --shadow:   0 1px 3px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.04);
          --toggle-bg: #e4e2dc;
        }

        [data-theme="dark"] {
          --bg:       #111110;
          --card:     #1c1c1a;
          --border:   #2a2a27;
          --border-2: #363633;
          --text:     #f0ede8;
          --sub:      #8a8780;
          --muted:    #55534e;
          --accent:   #f0ede8;
          --green:    #4ade80;
          --red:      #f87171;
          --red-bg:   #2a1a1a;
          --shadow:   0 1px 3px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.2);
          --toggle-bg: #2a2a27;
        }

        html, body {
          height: 100%;
          background: var(--bg);
          color: var(--text);
          font-family: 'Geist', system-ui, sans-serif;
          font-size: 15px;
          -webkit-font-smoothing: antialiased;
          transition: background 0.25s, color 0.25s;
        }


        body {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: flex-start;
          padding: 64px 20px 80px;
        }

        .page-header {
          width: 100%;
          max-width: 560px;
          margin-bottom: 40px;
          display: flex;
          align-items: flex-end;
          justify-content: space-between;
        }

        .header-left { display: flex; flex-direction: column; gap: 4px; }

        .page-eyebrow {
          font-size: 11px;
          font-weight: 500;
          letter-spacing: 0.1em;
          text-transform: uppercase;
          color: var(--muted);
        }

        .page-title {
          font-family: 'Instrument Serif', Georgia, serif;
          font-size: 36px;
          font-weight: 400;
          letter-spacing: -0.02em;
          color: var(--text);
          line-height: 1.1;
        }

        .page-title em { font-style: italic; color: var(--sub); }

        .theme-toggle {
          display: flex;
          align-items: center;
          gap: 8px;
          background: var(--card);
          border: 1px solid var(--border);
          border-radius: 999px;
          padding: 5px 6px;
          cursor: pointer;
          transition: background 0.2s, border-color 0.2s;
          box-shadow: var(--shadow);
        }

        .theme-toggle:hover { border-color: var(--border-2); }

        .toggle-icon {
          width: 28px; height: 28px;
          border-radius: 999px;
          display: flex; align-items: center; justify-content: center;
          font-size: 14px;
          transition: background 0.2s;
          color: var(--muted);
        }

        .toggle-icon.active { background: var(--toggle-bg); color: var(--text); }

        .card {
          width: 100%;
          max-width: 560px;
          background: var(--card);
          border: 1px solid var(--border);
          border-radius: 16px;
          box-shadow: var(--shadow);
          overflow: hidden;
          transition: background 0.25s, border-color 0.25s, box-shadow 0.25s;
        }

        .input-section { padding: 20px 20px 0; }

        .input-row { display: flex; gap: 8px; }

        .task-input {
          flex: 1;
          height: 44px;
          padding: 0 14px;
          background: var(--bg);
          border: 1px solid var(--border);
          border-radius: 10px;
          font-family: 'Geist', sans-serif;
          font-size: 14px;
          color: var(--text);
          outline: none;
          transition: border-color 0.15s, box-shadow 0.15s, background 0.25s;
        }

        .task-input::placeholder { color: var(--muted); }

        .task-input:focus {
          border-color: var(--accent);
          box-shadow: 0 0 0 3px rgba(128,128,128,0.12);
          background: var(--card);
        }

        .add-btn {
          height: 44px;
          padding: 0 18px;
          background: var(--accent);
          color: var(--bg);
          border: none;
          border-radius: 10px;
          font-family: 'Geist', sans-serif;
          font-size: 13px;
          font-weight: 500;
          cursor: pointer;
          transition: opacity 0.15s, transform 0.1s, background 0.25s, color 0.25s;
          white-space: nowrap;
        }

        .add-btn:hover { opacity: 0.82; }
        .add-btn:active { transform: scale(0.98); }

        .filter-bar {
          display: flex;
          align-items: center;
          gap: 4px;
          padding: 16px 20px 14px;
          border-bottom: 1px solid var(--border);
          transition: border-color 0.25s;
        }

        .filter-tab {
          height: 28px;
          padding: 0 12px;
          border-radius: 6px;
          border: 1px solid transparent;
          background: none;
          font-family: 'Geist', sans-serif;
          font-size: 12.5px;
          font-weight: 500;
          color: var(--muted);
          cursor: pointer;
          transition: background 0.15s, color 0.15s, border-color 0.15s;
        }

        .filter-tab:hover { background: var(--bg); color: var(--sub); }
        .filter-tab.active { background: var(--bg); color: var(--text); border-color: var(--border-2); }

        .spacer { flex: 1; }
        .task-count { font-size: 12px; color: var(--muted); }

        .task-list { list-style: none; }

        .task-item {
          display: flex;
          align-items: center;
          gap: 12px;
          padding: 13px 20px;
          border-bottom: 1px solid var(--border);
          transition: background 0.12s, border-color 0.25s, transform 0.15s;
          animation: fadeSlide 0.22s ease both;
        }

        @keyframes fadeSlide {
          from { opacity: 0; transform: translateY(-6px); }
          to   { opacity: 1; transform: translateY(0); }
        }

        .task-item:last-child { border-bottom: none; }
        .task-item:hover { background: var(--bg); transform: scale(1.01); } /* ADDED scale */
        .task-item.done { opacity: 0.45; }
        .task-item.removing { animation: fadeOut 0.2s ease forwards; }

        @keyframes fadeOut {
          to { opacity: 0; transform: translateX(8px); max-height: 0; padding: 0; border: none; }
        }

        .checkbox {
          width: 18px; height: 18px;
          border-radius: 5px;
          border: 1.5px solid var(--border-2);
          background: transparent;
          cursor: pointer;
          display: flex; align-items: center; justify-content: center;
          flex-shrink: 0;
          transition: border-color 0.15s, background 0.15s;
          color: transparent;
          font-size: 10px;
        }

        .checkbox:hover { border-color: var(--accent); }
        .checkbox.checked { background: var(--accent); border-color: var(--accent); color: var(--bg); }

        .task-text {
          flex: 1;
          font-size: 14px;
          color: var(--text);
          line-height: 1.45;
          word-break: break-word;
          transition: color 0.25s;
        }

        .task-item.done .task-text { text-decoration: line-through; color: var(--muted); }

        .edit-btn {
          width: 28px; height: 28px;
          border-radius: 7px;
          border: 1px solid transparent;
          background: none;
          color: var(--muted);
          cursor: pointer;
          display: flex; align-items: center; justify-content: center;
          opacity: 0;
          transition: opacity 0.15s, background 0.15s, color 0.15s;
          flex-shrink: 0;
          font-size: 13px;
        }

        .task-item:hover .edit-btn { opacity: 1; }
        .edit-btn:hover { background: var(--bg); color: var(--text); border-color: var(--border-2); }

        .del-btn {
          width: 28px; height: 28px;
          border-radius: 7px;
          border: 1px solid transparent;
          background: none;
          color: var(--muted);
          cursor: pointer;
          display: flex; align-items: center; justify-content: center;
          opacity: 0;
          transition: opacity 0.15s, background 0.15s, color 0.15s;
          flex-shrink: 0;
        }

        .task-item:hover .del-btn { opacity: 1; }

        .del-btn:hover { background: var(--red-bg); color: var(--red); border-color: var(--red-bg); }



        .empty {
          padding: 48px 20px;
          text-align: center;
          color: var(--muted);
          font-size: 13.5px;
          display: none;
        }



        .footer-bar {
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 13px 20px;
          border-top: 1px solid var(--border);
          background: var(--bg);
          transition: background 0.25s, border-color 0.25s;
        }

        .progress-wrap { display: flex; align-items: center; gap: 10px; }

        .progress-bar {
          width: 80px; height: 3px;
          background: var(--border);
          border-radius: 99px;
          overflow: hidden;
          transition: background 0.25s;
        }

        .progress-fill {
          height: 100%;
          background: var(--green);
          border-radius: 99px;
          transition: width 0.4s ease, background 0.25s;
          width: 0%;
        }

        .progress-pct { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

        .clear-btn {
          font-size: 12px;
          font-family: 'Geist', sans-serif;
          color: var(--muted);
          background: none;
          border: none;
          cursor: pointer;
          transition: color 0.15s;
          padding: 0;
        }

        .clear-btn:hover { color: var(--red); }

        .toast {
          position: fixed;
          bottom: 28px;
          left: 50%;
          transform: translateX(-50%) translateY(12px);
          background: var(--text);
          color: var(--bg);
          font-size: 12.5px;
          font-family: 'Geist', sans-serif;
          padding: 8px 16px;
          border-radius: 8px;
          opacity: 0;
          pointer-events: none;
          transition: opacity 0.2s, transform 0.2s;
          white-space: nowrap;
        }

        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
              body::after {
  content: "ETHARA AI";
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 40px;
  font-weight: 600;
  letter-spacing: 6px;
  color: rgba(0, 0, 0, 0.08);
  pointer-events: none;
  z-index: 0;
}


[data-theme="dark"] body::after {
  color: rgba(255, 255, 255, 0.08);
}
    </style>
</head>
<body>

<header class="page-header">
    <div class="header-left">
        <p class="page-eyebrow">Personal workspace</p>
        <h1 class="page-title">Task <em>Manager</em></h1>
    </div>
    <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">
        <div class="toggle-icon active" id="iconLight">☀️</div>
        <div class="toggle-icon" id="iconDark">🌙</div>
    </button>
</header>

<div class="card">
    <div class="input-section">
        <div class="input-row">
            <input class="task-input" id="taskInput" type="text" placeholder="Add a new task…" maxlength="120" autocomplete="off" />
            <button class="add-btn" onclick="addTask()">Add task</button>
        </div>
        <!-- ADDED: Search -->
        <input class="task-input" style="margin-top:10px; margin-bottom:16px;"
               placeholder="Search tasks..."
               oninput="searchTask(this.value)">
    </div>

    <div class="filter-bar">
        <button class="filter-tab active" onclick="setFilter('all', this)">All</button>
        <button class="filter-tab" onclick="setFilter('active', this)">Active</button>
        <button class="filter-tab" onclick="setFilter('done', this)">Done</button>
        <div class="spacer"></div>
        <span class="task-count" id="countLabel"></span>
    </div>

    <ul class="task-list" id="taskList"></ul>
    <div class="empty" id="emptyState">Nothing here yet</div>

    <div class="footer-bar">
        <div class="progress-wrap">
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            <span class="progress-pct" id="progressPct">0%</span>
        </div>
        <button class="clear-btn" onclick="clearDone()">Clear completed</button>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    const API = "/tasks";
    let tasks = [];
    let filter = "all";

    /* ── Theme ── */
    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.getAttribute("data-theme") === "dark";
      html.setAttribute("data-theme", isDark ? "light" : "dark");
      document.getElementById("iconLight").classList.toggle("active", isDark);
      document.getElementById("iconDark").classList.toggle("active", !isDark);
      localStorage.setItem("theme", isDark ? "light" : "dark");
    }

    const saved = localStorage.getItem("theme");
    if (saved === "dark") {
      document.documentElement.setAttribute("data-theme", "dark");
      document.getElementById("iconLight").classList.remove("active");
      document.getElementById("iconDark").classList.add("active");
    }

    /* ── Helpers ── */
    function esc(s) {
      return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function toast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove("show"), 1800);
    }

    /* ── Render ── */
    function render() {
      const list  = document.getElementById("taskList");
      const empty = document.getElementById("emptyState");
      const count = document.getElementById("countLabel");
      const fill  = document.getElementById("progressFill");
      const pct   = document.getElementById("progressPct");

      const total = tasks.length;
      const done  = tasks.filter(t => t.completed).length;
      const p     = total ? Math.round((done / total) * 100) : 0;

      fill.style.width = p + "%";
      pct.textContent  = p + "%";

      const visible = tasks.filter(t =>
        filter === "all"    ? true :
        filter === "active" ? !t.completed : t.completed
      );

      count.textContent = visible.length + " task" + (visible.length !== 1 ? "s" : "");
      list.innerHTML = "";

      if (visible.length === 0) {
        empty.style.display = "block";
      } else {
        empty.style.display = "none";
        visible.forEach((task, i) => {
          const li = document.createElement("li");
          li.className = "task-item" + (task.completed ? " done" : "");
          li.id = "task-" + task.id;
          li.style.animationDelay = i * 0.03 + "s";
          li.innerHTML = `
            <button class="checkbox${task.completed ? " checked" : ""}" onclick="toggleTask(${task.id})">
              ${task.completed ? "✓" : ""}
            </button>
            <span class="task-text">${esc(task.title)}</span>
            <button class="edit-btn" onclick="editTask(${task.id})">✏️</button>
            <button class="del-btn" onclick="deleteTask(${task.id})">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
              </svg>
            </button>`;
          list.appendChild(li);
        });
      }
    }

    /* ── API-connected actions ── */
    function addTask() {
      const input = document.getElementById("taskInput");
      const title = input.value.trim();
      if (!title) { input.focus(); return; }

      fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title, completed: false })
      }).then(() => {
        input.value = "";
        input.focus();
        loadTasks();
        toast("Task added");
      });
    }

    function toggleTask(id) {
      fetch(API + "/" + id + "/complete", {
        method: "PATCH"
      }).then(() => loadTasks());
    }

    function deleteTask(id) {
      const el = document.getElementById("task-" + id);
      if (el) {
        el.classList.add("removing");
        setTimeout(() => {
          fetch(API + "/" + id, { method: "DELETE" })
            .then(() => loadTasks());
        }, 200);
      }
      toast("Removed");
    }

    function clearDone() {
      const n = tasks.filter(t => t.completed).length;
      if (!n) { toast("No completed tasks"); return; }
      const deletePromises = tasks
        .filter(t => t.completed)
        .map(t => fetch(API + "/" + t.id, { method: "DELETE" }));
      Promise.all(deletePromises).then(() => {
        loadTasks();
        toast("Cleared " + n + " task" + (n !== 1 ? "s" : ""));
      });
    }

    function setFilter(f, btn) {
      filter = f;
      document.querySelectorAll(".filter-tab").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      render();
    }

    /* ── Load from API ── */
    function loadTasks() {
      fetch(API)
        .then(r => r.json())
        .then(data => { tasks = data; render(); });
    }

    document.getElementById("taskInput").addEventListener("keydown", e => {
      if (e.key === "Enter") addTask();
    });

    loadTasks();

    // ADDED: Edit Task
    function editTask(id) {
      const t = tasks.find(x => x.id === id);
      const newTitle = prompt("Edit task:", t ? t.title : "");
      if (!newTitle) return;

      fetch(API + "/" + id, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          title: newTitle,
          completed: t ? t.completed : false
        })
      }).then(() => {
        loadTasks();
        toast("Updated");
      });
    }

    // ADDED: Search
    function searchTask(text) {
      const filtered = tasks.filter(t =>
        t.title.toLowerCase().includes(text.toLowerCase())
      );
      renderFiltered(filtered);
    }

    // ADDED: Render filtered list (keeps your UI)
    function renderFiltered(listData) {
      const list  = document.getElementById("taskList");
      const empty = document.getElementById("emptyState");

      list.innerHTML = "";

      if (listData.length === 0) {
        empty.style.display = "block";
        return;
      } else {
        empty.style.display = "none";
      }

      listData.forEach((task, i) => {
        const li = document.createElement("li");
        li.className = "task-item" + (task.completed ? " done" : "");
        li.id = "task-" + task.id;
        li.style.animationDelay = i * 0.03 + "s";
        li.innerHTML = `
          <button class="checkbox${task.completed ? " checked" : ""}" onclick="toggleTask(${task.id})">
            ${task.completed ? "✓" : ""}
          </button>
          <span class="task-text">${esc(task.title)}</span>
          <button class="edit-btn" onclick="editTask(${task.id})">✏️</button>
          <button class="del-btn" onclick="deleteTask(${task.id})">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>`;
        list.appendChild(li);
      });
    }
</script>
</body>
</html>
